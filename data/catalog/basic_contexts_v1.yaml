# Basic-context catalog v1 (stage1.md, sections 3.4 and 10.4).
# `profile` (D^def: mean, se, icc2k per style) is written by the offline rating step O2
# (gnwt.stage1.offline.reader.rate_catalog) from >= 3 raters answering the O*NET-WI style question
# "in this context, does a person with [style s] help or hinder the activity and the relationship,
# -3..+3?". It is NEVER written by hand. `null` = not rated yet = neutral profile (section 6 rule).
# `sign_check` is used only by test P4 (warning, never blocks).
version: 1.0.0
rating_protocol: onet_wi_question_v1
generic_prior: mean_of_catalog
contexts:
  - id: speed_dating
    aliases: {vi: [hẹn hò nhanh, hẹn hò, tìm người yêu, buổi hẹn hò],
