modifiers:
  strong:   {vi: [rất, cực kỳ, cực, hết sức, thật sự, phải, bắt buộc, cần phải, nhất định, rất cần, vô cùng, buộc phải, nhất thiết phải, không ngừng, đặc biệt cần],
             en: [very, highly, must, required, really, extremely, absolutely, essential, crucial, mandatory]}
  weak:     {vi: [hơi, một chút, chút, khá, tương đối, không quá, không cần quá, phần nào],
             en: [somewhat, a bit, slightly, a little, fairly, moderately]}
  neg_pre:  {vi: [không cần, chẳng cần, chả cần, không nhất thiết, không bắt buộc, không, chẳng, không phải],
             en: [no need, not required, "don't need", "do not need", "doesn't need", "does not need", not, no, without]}
  neg_post: {vi: [không quan trọng, thì không cần, không cần lắm, cũng được, không thành vấn đề],
             en: [not important, "doesn't matter", optional, not needed, not necessary]}
  prohibit: {vi: [không được, cấm, đừng, tránh, không nên],
             en: ["don't", never, avoid, do not]}
  ignore:   {vi: [không khí, không gian, cần, có],
             en: [need, needs, require, requires]}
fixed:      # matched before every other rule
  - {pattern: "không thể thiếu {X}", cls: strong}
  - {pattern: "{X} là không thể thiếu", cls: strong}
  - {pattern: "không chỉ {X} mà còn {Y}", cls: base}
  - {pattern: "không những {X} mà còn {Y}", cls: base}
  - {pattern: "not only {X} but also {Y}", cls: base}
  - {pattern: "{X} is a must", cls: strong}
clause_split: {punct: [",", ";", ".", "!", "?"], words: [nhưng, but]}
