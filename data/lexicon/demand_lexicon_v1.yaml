# Demand lexicon v1 (stage1.md, section 10.3). Words and directions ONLY, no weights: the level of every
# cue class (theta) is estimated from the label set by gnwt.stage1.offline.reader (PAV + Bühlmann).
# Seed entries are translated from the O*NET definition of each Work Style, then widened with synonyms.
# Editing this file means re-estimating theta and k and re-running the tests (U6-U8).
version: 1.0.0
styles_source: onet_2025_phase1
