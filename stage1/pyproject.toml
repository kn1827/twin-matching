[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stage1"
version = "1.0.0"
description = "Stage 1: profile + context sentence -> directed a0 and mutual m0 (SRRM probit core, keyword context reader, no LLM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "pyyaml>=6",
]

[project.optional-dependencies]
# strong learners used only by experiments/compare_baselines.py
baselines = ["catboost>=1.2", "xgboost>=2", "interpret>=0.6", "torch>=2.3"]
tabpfn = ["tabpfn>=2"]
# optional, off by default: nearest basic context for unknown context names
embedding = ["sentence-transformers>=3"]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stage1 = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: Gibbs runs on simulated data (about 30 s)"]
